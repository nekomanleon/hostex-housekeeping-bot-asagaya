name: Hostex Housekeeping Reminder

on:
  workflow_dispatch:
  schedule:
       - cron: "0 23 * * *" # 08:00 Japan time every day

permissions:
  contents: read

concurrency:
  group: hostex-housekeeping-reminder
  cancel-in-progress: false

jobs:
  remind-cleaning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Tokyo
      HOSTEX_HEADLESS: "true"

      HOSTEX_CLEANING_TARGET_ROOMS: "阿佐谷A,阿佐谷B,阿佐谷C"
      HOSTEX_CLEANING_TIMEZONE: "Asia/Tokyo"
      HOSTEX_REMINDER_DAY_DIFFS: "2,1,0"
      HOSTEX_USERNAME: "leonzhang@lodgegeek.com"
      HOSTEX_PASSWORD: "Bigman844721482"
      WECOM_WEBHOOK: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=c0792157-f79f-4ec3-9151-662c804619e1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run housekeeping reminder
        shell: bash
        run: python hostex_cleaning_reminder.py

      - name: Upload reminder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostex-housekeeping-reminder-${{ github.run_id }}
          path: logs/hostex-housekeeping-bot/
          if-no-files-found: warn
