name: Hostex Housekeeping Reminder

on:
  workflow_dispatch:
  schedule:
    - cron: "58 0 * * *" # 08:58 Asia/Shanghai every day

permissions:
  contents: read

concurrency:
  group: hostex-housekeeping-reminder
  cancel-in-progress: false

jobs:
  remind-cleaning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
      HOSTEX_HEADLESS: "true"
      HOSTEX_CLEANING_TARGET_ROOMS: "押上301,押上402"
      HOSTEX_CLEANING_TIMEZONE: "Asia/Shanghai"
      HOSTEX_REMINDER_DAY_DIFFS: "2,1,0"
      HOSTEX_USERNAME: "leonzhang@lodgegeek.com"
      HOSTEX_PASSWORD: "Bigman844721482"
      WECOM_WEBHOOK: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=9f64d413-d651-4a75-8a4d-a55fa173c754"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run housekeeping reminder
        shell: bash
        run: python hostex_cleaning_reminder.py

      - name: Upload reminder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostex-housekeeping-reminder-${{ github.run_id }}
          path: logs/hostex-housekeeping-bot/
          if-no-files-found: warn
